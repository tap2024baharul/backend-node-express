apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ninja-nodejs-service  
    # tags.datadoghq.com/env: production
    # tags.datadoghq.com/service: ninja-nodejs-service
    # tags.datadoghq.com/version: 5.35.0      
  name: ninja-nodejs-service
  namespace: default
spec:
  selector:
    matchLabels:
      app: ninja-nodejs-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ninja-nodejs-service
        # tags.datadoghq.com/env: production
        # tags.datadoghq.com/service: ninja-nodejs-service
        # tags.datadoghq.com/version: 5.35.0
        # admission.datadoghq.com/enabled: "true"
      # annotations:
      #   admission.datadoghq.com/js-lib.version: v5.35.0
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-class
                operator: In
                values:
                - workloads
            weight: 1
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ninja-nodejs-service
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - image: 955487219011.dkr.ecr.ap-south-1.amazonaws.com/backend-node-express-develop:770844c20cfb48e0c1c8a4a33b65dddf819930ff
        imagePullPolicy: IfNotPresent
        name: ninja-nodejs-service
        ports:
        - containerPort: 6666
          name: http
          protocol: TCP
        resources: 
          limits:
            cpu: "3"
            memory: "3Gi"
          requests:
            cpu: "1.5"
            memory: "2Gi"
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        env:
          - name: DD_AGENT_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: DD_ENV
            value: "production"
          - name: DD_SERVICE
            value: "ninja-nodejs-service"
          - name: DD_VERSION
            value: "1.0.0"
          - name: DD_LOGS_INJECTION
            value: "true"
          - name: DD_TRACE_DEBUG
            value: "true"        
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: node-class
        operator: Equal
        value: workloads

---

apiVersion: v1
kind: Service
metadata:
  name: ninja-nodejs-service
  namespace: default
spec:
  ports:
  - name: http
    port: 6666
    protocol: TCP
    targetPort: 6666
  selector:
    app: ninja-nodejs-service
  sessionAffinity: None
  type: ClusterIP

---

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations:
  name: ninja-nodejs-service
  namespace: default
spec:
  gateways:
  - tap-http-gw
  hosts:
  - ninja-nodejs-service.tapperstaging.com
  - ninja-nodejs-service
  http:
  - route:
    - destination:
        host: ninja-nodejs-service
        port:
          number: 6666

